<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>账户与回测</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="data.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --card: #101826;
      --ink: #eef4ff;
      --muted: #8b9bb4;
      --line: rgba(140, 180, 220, 0.14);
      --cyan: #3ee0ff;
      --magenta: #ff4ecd;
      --lime: #c4f042;
      --neg: #ff5d73;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      line-height: 1.45;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(62, 224, 255, 0.10), transparent 55%),
        radial-gradient(700px 380px at 100% 0%, rgba(255, 78, 205, 0.08), transparent 50%);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
      background: rgba(7, 11, 20, 0.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 14px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
    }
    .tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 10px 0;
      font-weight: 600;
    }
    .tabs button.on {
      background: #182234;
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .wrap {
      position: relative;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 16px 16px calc(40px + env(safe-area-inset-bottom));
    }
    .view { display: none; }
    .view.show { display: block; }
    .live-meta, .toolbar, footer {
      color: var(--muted);
      font-size: 13px;
    }
    .live-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 4px 0 14px;
    }
    .live-meta span { min-width: 0; }
    .cards, .live-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .live-grid { grid-template-columns: 1fr 1fr; }
    .cards { grid-template-columns: 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .card.active { border-color: color-mix(in srgb, currentColor 55%, var(--line)); }
    .live-card { cursor: default; }
    .card .k {
      color: var(--muted);
      font-size: 12px;
    }
    .card .v {
      font-family: "DM Sans", "Noto Sans SC", sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 6px 0 2px;
      letter-spacing: -0.02em;
    }
    .card .v.neg { color: var(--neg); }
    .card .s { font-size: 12px; color: var(--muted); }
    .toolbar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 0 0 12px;
      -webkit-overflow-scrolling: touch;
    }
    button {
      border: 1px solid var(--line);
      background: #121a28;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      white-space: nowrap;
    }
    button.on {
      background: rgba(62, 224, 255, 0.14);
      border-color: rgba(62, 224, 255, 0.45);
      color: #fff;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 8px 8px;
      margin-bottom: 12px;
    }
    .panel h2 {
      margin: 0 10px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    #navChart, #ddChart, #yearChart, #liveChart { width: 100%; }
    #navChart { height: 340px; }
    #ddChart { height: 220px; }
    #yearChart { height: 260px; }
    #liveChart { height: 300px; }
    .live-empty { color: var(--muted); font-size: 13px; padding: 8px 12px 12px; }
    .js-plotly-plot .modebar { display: none !important; }
    footer { margin-top: 8px; }
    .err { color: var(--neg); }
    @media (min-width: 860px) {
      header { padding: 22px 28px 16px; }
      header h1 { font-size: 28px; }
      .wrap { padding: 22px 28px 48px; }
      .tabs { width: 280px; }
      .cards, .live-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      #navChart { height: 460px; }
      #ddChart { height: 250px; }
      #yearChart { height: 320px; }
      #liveChart { height: 380px; }
      .card { cursor: pointer; }
      .live-card { cursor: default; }
    }
  </style>
</head>
<body>
  <header>
    <h1>账户与回测</h1>
    <p id="subtitle"></p>
    <div class="tabs">
      <button class="on" id="tabLive">实盘</button>
      <button id="tabBack">回测</button>
    </div>
  </header>
  <div class="wrap">
    <section class="view show" id="viewLive">
      <div class="live-meta">
        <span id="liveMeta">正在读取实盘账户…</span>
        <button id="refreshLive">刷新</button>
      </div>
      <div class="live-grid" id="liveGrid"></div>
      <section class="panel">
        <h2>港币总资产</h2>
        <div id="liveChart"></div>
        <div class="live-empty" id="liveHint"></div>
      </section>
    </section>
    <section class="view" id="viewBack">
      <section class="cards" id="cards"></section>
      <div class="toolbar">
        <button class="on" data-key="seriesA">组合 A</button>
        <button class="on" data-key="strategy">STRATEGY</button>
        <button class="on" data-key="spy">标普 SP 500</button>
        <button id="logBtn">对数</button>
        <button id="relBtn">归一化</button>
      </div>
      <section class="panel">
        <h2>净值曲线</h2>
        <div id="navChart"></div>
      </section>
      <section class="panel">
        <h2>回撤</h2>
        <div id="ddChart"></div>
      </section>
      <section class="panel">
        <h2>分年收益</h2>
        <div id="yearChart"></div>
      </section>
      <footer>点上方标签可显示或隐藏曲线。选股细节不公开。</footer>
    </section>
  </div>
  <script>
    const D = window.BACKTEST;
    const LABELS = { seriesA: "组合 A", strategy: "STRATEGY", spy: "标普 SP 500" };
    const COLORS = { seriesA: "#3ee0ff", strategy: "#ff4ecd", spy: "#c4f042" };
    const vis = { seriesA: true, strategy: true, spy: true };
    let livePoints = [];
    let liveFx = null;
    let logScale = false;
    let relative = false;

    document.getElementById("subtitle").textContent = "实盘资金";

    const cards = document.getElementById("cards");
    ["seriesA", "strategy", "spy"].forEach((k) => {
      const m = D.metrics[k];
      const el = document.createElement("div");
      el.className = "card active";
      el.style.color = COLORS[k];
      el.dataset.key = k;
      el.innerHTML = `
        <div class="k">${LABELS[k]}</div>
        <div class="v">$${(m.final / 1e6).toFixed(2)}M</div>
        <div class="s">累计 ${(m.total * 100).toFixed(1)}% · 年化 ${(m.cagr * 100).toFixed(1)}% · 回撤 ${(m.mdd * 100).toFixed(1)}%</div>`;
      el.onclick = () => {
        vis[k] = !vis[k];
        el.classList.toggle("active", vis[k]);
        document.querySelector(`button[data-key="${k}"]`).classList.toggle("on", vis[k]);
        drawAll();
      };
      cards.appendChild(el);
    });

    document.querySelectorAll("button[data-key]").forEach((btn) => {
      btn.onclick = () => {
        const k = btn.dataset.key;
        vis[k] = !vis[k];
        btn.classList.toggle("on", vis[k]);
        document.querySelector(`.card[data-key="${k}"]`).classList.toggle("active", vis[k]);
        drawAll();
      };
    });
    document.getElementById("logBtn").onclick = function () {
      logScale = !logScale;
      this.classList.toggle("on", logScale);
      drawNav();
    };
    document.getElementById("relBtn").onclick = function () {
      relative = !relative;
      this.classList.toggle("on", relative);
      drawNav();
    };

    function seriesY(key) {
      const arr = D.nav[key];
      if (!relative) return arr;
      const base = arr[0];
      return arr.map((v) => v / base);
    }

    function narrow() {
      return window.innerWidth < 860;
    }

    function layoutBase() {
      const mobile = narrow();
      return {
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        autosize: true,
        showlegend: false,
        font: { family: "Noto Sans SC, PingFang SC, sans-serif", color: "#9db0c9", size: mobile ? 11 : 12 },
        margin: mobile ? { l: 46, r: 12, t: 8, b: 36 } : { l: 64, r: 20, t: 12, b: 44 },
        hovermode: "x unified",
        hoverlabel: { bgcolor: "#101826", bordercolor: "#3ee0ff", font: { color: "#eef4ff", size: 12 } },
        xaxis: {
          automargin: true,
          gridcolor: "rgba(255,255,255,0.05)",
          zeroline: false,
          linecolor: "rgba(255,255,255,0.08)",
          tickfont: { color: "#8b9bb4" },
        },
        yaxis: {
          automargin: true,
          gridcolor: "rgba(255,255,255,0.05)",
          zeroline: false,
          linecolor: "rgba(255,255,255,0.08)",
          tickfont: { color: "#8b9bb4" },
          title: { standoff: mobile ? 6 : 12, font: { size: mobile ? 11 : 12, color: "#8b9bb4" } },
        },
      };
    }

    const plotCfg = { responsive: true, displayModeBar: false, displaylogo: false };

    function traces(kind) {
      return ["seriesA", "strategy", "spy"].filter((k) => vis[k]).map((k) => ({
        x: D.dates,
        y: kind === "nav" ? seriesY(k) : D.drawdown[k],
        name: LABELS[k],
        type: "scatter",
        mode: "lines",
        line: { color: COLORS[k], width: 2.2 },
        hovertemplate: "%{x}<br>%{y}<extra>" + LABELS[k] + "</extra>",
      }));
    }

    function drawNav() {
      const base = layoutBase();
      const mobile = narrow();
      Plotly.react("navChart", traces("nav"), {
        ...base,
        yaxis: {
          ...base.yaxis,
          title: { ...base.yaxis.title, text: relative ? "归一化" : (mobile ? "市值" : "市值（美元）") },
          type: logScale ? "log" : "linear",
          tickformat: relative ? ".2f" : (mobile ? "~s" : ",.0f"),
        },
        xaxis: {
          ...base.xaxis,
          type: "date",
          rangeslider: { visible: !mobile, bgcolor: "rgba(255,255,255,0.04)", thickness: 0.12 },
        },
      }, plotCfg);
    }

    function drawDd() {
      const base = layoutBase();
      Plotly.react("ddChart", traces("dd"), {
        ...base,
        yaxis: { ...base.yaxis, title: { ...base.yaxis.title, text: "回撤" }, tickformat: ".0%" },
        xaxis: { ...base.xaxis, type: "date" },
      }, plotCfg);
    }

    function drawYear() {
      const base = layoutBase();
      const years = D.yearly.map((r) => String(r.year));
      const bars = ["seriesA", "strategy", "spy"].filter((k) => vis[k]).map((k) => ({
        x: years,
        y: D.yearly.map((r) => r[k] * 100),
        name: LABELS[k],
        type: "bar",
        marker: { color: COLORS[k] },
        hovertemplate: "%{x}<br>%{y:.1f}%<extra>" + LABELS[k] + "</extra>",
      }));
      Plotly.react("yearChart", bars, {
        ...base,
        barmode: "group",
        yaxis: { ...base.yaxis, title: { ...base.yaxis.title, text: "收益 %" }, zeroline: true },
        xaxis: { ...base.xaxis },
      }, plotCfg);
    }

    function resizeCharts() {
      ["navChart", "ddChart", "yearChart", "liveChart"].forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.data) Plotly.Plots.resize(el);
      });
    }

    function drawAll() { drawNav(); drawDd(); drawYear(); resizeCharts(); }
    window.addEventListener("resize", () => {
      if (document.getElementById("viewBack").classList.contains("show")) drawAll();
      if (document.getElementById("viewLive").classList.contains("show")) drawLiveChart();
    });

    const tabLive = document.getElementById("tabLive");
    const tabBack = document.getElementById("tabBack");
    tabLive.onclick = () => {
      tabLive.classList.add("on");
      tabBack.classList.remove("on");
      document.getElementById("viewLive").classList.add("show");
      document.getElementById("viewBack").classList.remove("show");
      document.getElementById("subtitle").textContent = "实盘资金";
      requestAnimationFrame(drawLiveChart);
    };
    tabBack.onclick = () => {
      tabBack.classList.add("on");
      tabLive.classList.remove("on");
      document.getElementById("viewBack").classList.add("show");
      document.getElementById("viewLive").classList.remove("show");
      document.getElementById("subtitle").textContent =
        D.meta.start.slice(0, 4) + " – " + D.meta.end.slice(0, 4);
      requestAnimationFrame(() => {
        drawAll();
        requestAnimationFrame(resizeCharts);
      });
    };

    function money(v, digits) {
      if (v == null || Number.isNaN(v)) return "—";
      return Number(v).toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }

    function liveCard(label, value, extra, neg) {
      return `<div class="card live-card"><div class="k">${label}</div>
        <div class="v${neg ? " neg" : ""}">${value}</div>
        <div class="s">${extra || ""}</div></div>`;
    }

    function hkdValue(p) {
      if (p.hkd_assets != null && !Number.isNaN(Number(p.hkd_assets))) return Number(p.hkd_assets);
      if (p.total_assets != null && liveFx) return Number(p.total_assets) * liveFx;
      return null;
    }

    function drawLiveChart() {
      const hint = document.getElementById("liveHint");
      const ys = livePoints.map(hkdValue);
      const xs = livePoints.map((p) => (p.t || "").replace(" ", "T"));
      const ok = ys.some((v) => v != null);
      if (!livePoints.length || !ok) {
        hint.textContent = "还没有历史点，同步开始后这里会画出资金曲线。";
        Plotly.purge("liveChart");
        return;
      }
      hint.textContent = "";
      const tracesLive = [{
        x: xs,
        y: ys,
        name: "港币总资产",
        type: "scatter",
        mode: livePoints.length === 1 ? "markers" : "lines",
        marker: { size: 6, color: "#3ee0ff" },
        line: { color: "#3ee0ff", width: 2.4 },
        hovertemplate: "%{x}<br>HK$%{y:,.0f}<extra>港币总资产</extra>",
      }];
      const base = layoutBase();
      const mobile = narrow();
      Plotly.react("liveChart", tracesLive, {
        ...base,
        yaxis: {
          ...base.yaxis,
          title: { ...base.yaxis.title, text: mobile ? "港币" : "港币总资产" },
          tickformat: mobile ? "~s" : ",.0f",
          zeroline: false,
        },
        xaxis: { ...base.xaxis, type: "date" },
      }, plotCfg);
    }

    async function loadLiveHistory() {
      try {
        const res = await fetch("account_history.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const hist = await res.json();
          if (hist && Array.isArray(hist.points) && hist.points.length) livePoints = hist.points;
        }
      } catch (e) {}
      drawLiveChart();
    }

    async function loadLive() {
      const meta = document.getElementById("liveMeta");
      const grid = document.getElementById("liveGrid");
      try {
        let d = null;
        try {
          const res = await fetch("/api/account", { cache: "no-store" });
          if (res.ok) d = await res.json();
        } catch (e) {}
        if (!d || !d.ok) {
          const snap = await fetch("account.json?t=" + Date.now(), { cache: "no-store" });
          d = await snap.json();
        }
        if (!d.ok) throw new Error(d.error || "查询失败");
        meta.textContent = `${d.env} · ${d.card} · ${d.updated}`;
        if (d.hkd_assets && d.total_assets) liveFx = Number(d.hkd_assets) / Number(d.total_assets);
        grid.innerHTML = [
          liveCard("总资产", "$" + money(d.total_assets, 2), "美元"),
          liveCard("持仓市值", "$" + money(d.market_val, 2), "证券"),
          liveCard("现金", "$" + money(d.cash, 2), "美元现金", d.cash < 0),
          liveCard("购买力", "$" + money(d.power, 2), ""),
          liveCard("冻结资金", "$" + money(d.frozen_cash, 2), ""),
          liveCard("港币总资产", "HK$" + money(d.hkd_assets, 0), "同一账户"),
        ].join("");
        if (!livePoints.length) {
          livePoints = [{
            t: d.updated,
            hkd_assets: d.hkd_assets,
            total_assets: d.total_assets,
          }];
        }
      } catch (err) {
        meta.innerHTML = `<span class="err">读取失败：${err.message}</span>`;
      }
      await loadLiveHistory();
    }
    document.getElementById("refreshLive").onclick = loadLive;
    loadLive();
    setInterval(loadLive, 15000);
  </script>
</body>
</html>
